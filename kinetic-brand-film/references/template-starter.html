<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Kinetic Brand Film — High Voltage Manifesto</title>
    <!-- Modern Tech Fonts: Plus Jakarta Sans & Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #08090b;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: #08090b;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .font-mono {
        font-family: "Roboto Mono", monospace;
      }

      /* Global Background Grid & Lighting */
      .bg-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 80px 80px;
        pointer-events: none;
      }
      .ambient-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
        pointer-events: none;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
        pointer-events: none;
      }

      /* High-Tech Badges & Cards */
      .metallic-badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 20px;
        border-radius: 9999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.5);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #e2e8f0;
      }
      .card-surface {
        background: rgba(14, 16, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .status-dot-mint {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10a37f;
        box-shadow: 0 0 12px #10a37f;
      }
      .status-dot-blue {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 12px #38bdf8;
      }

      /* Frame Framing for Portraits (Safe ratio, no head cropping) */
      .cinematic-frame {
        position: relative;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
      }

      /* Camcorder HUD Overlay */
      .camcorder-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        padding: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .rec-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: "Roboto Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        color: #ef4444;
        letter-spacing: 0.1em;
      }
      .rec-dot {
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        box-shadow: 0 0 8px #ef4444;
      }
      .timecode {
        font-family: "Roboto Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.75);
      }
      .hud-bracket {
        position: absolute;
        width: 14px;
        height: 14px;
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* Matrix Repeat Background */
      .matrix-repeat-bg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        opacity: 0.12;
        pointer-events: none;
        overflow: hidden;
      }
      .matrix-row {
        display: flex;
        white-space: nowrap;
        gap: 40px;
        font-family: "Roboto Mono", monospace;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.15em;
        color: #64748b;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 1. AUDIO TRACK (Locked to exact duration) -->
      <audio src="audio.mp3" preload="auto"></audio>

      <!-- 2. OPTICAL OVERLAYS (Beat-Flash & Shake) -->
      <div id="flash-overlay" style="position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; z-index: 90;" data-layout-ignore="true"></div>
      <div id="glitch-overlay" style="position: absolute; inset: 0; background: rgba(56, 189, 248, 0.08); mix-blend-mode: screen; opacity: 0; pointer-events: none; z-index: 85;" data-layout-ignore="true"></div>
      <div class="vignette" style="z-index: 80;"></div>

      <!-- 3. HYPERFRAMES COMPOSITION -->
      <div class="composition" data-duration="60.0">
        <div class="track" data-track="main">

          <!-- SCENE 1: HOOK & MANIFESTO (0.0s – 10.0s) -->
          <section id="scene-hook" class="clip" data-start="0" data-duration="10">
            <div class="bg-grid"></div>
            <div class="ambient-glow"></div>

            <!-- Kinetic Slam Layer -->
            <div id="hook-slam-container" style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 80px; text-align: center; z-index: 20; pointer-events: none;">
              <div id="slam-block-1" style="display: flex; flex-direction: column; align-items: center; opacity: 0;">
                <div style="font-size: 48px; font-weight: 800; color: #94a3b8; letter-spacing: 0.08em;">BẮT ĐẦU VỚI</div>
                <div style="font-size: 92px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: -0.02em; text-shadow: 0 0 45px rgba(56,189,248,0.6); margin-top: 8px;">
                  NĂNG LỰC <span style="color: #38bdf8;">THỰC THI.</span>
                </div>
              </div>
            </div>
          </section>

          <!-- SCENE 2: CAMERA RIGGING & TEAM TRACKING (10.0s – 20.0s) -->
          <section id="scene-team" class="clip" data-start="10" data-duration="10">
            <div class="bg-grid"></div>

            <!-- Dedicated Camera Rig for Scene 2 -->
            <div id="camera-rig-scene2" style="position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 50%; opacity: 0; z-index: 18; pointer-events: none;">
              <!-- Left Anchor -->
              <div style="position: absolute; top: 140px; left: 160px; width: 480px;">
                <div class="cinematic-frame" style="width: 100%; height: 520px;">
                  <img src="portrait.jpg" alt="Founder" style="width: 100%; height: 100%; object-fit: cover; object-position: center 30%;">
                  <div class="camcorder-overlay">
                    <div class="rec-indicator"><span class="rec-dot"></span>REC 24FPS</div>
                    <div class="timecode">00:00:10:00</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline();

      // Optical Beat Flash Helper
      function addBeatFlash(time, opacity = 0.3) {
        tl.fromTo(
          "#flash-overlay",
          { opacity: opacity },
          { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false },
          time
        );
      }

      // Camera Shake Helper
      function addCameraShake(time, intensity = 6) {
        const shakeTl = gsap.timeline();
        shakeTl
          .to("#root", { x: intensity, y: -intensity, duration: 0.04, ease: "none" })
          .to("#root", { x: -intensity, y: intensity, duration: 0.04, ease: "none" })
          .to("#root", { x: intensity * 0.4, y: -intensity * 0.4, duration: 0.04, ease: "none" })
          .to("#root", { x: 0, y: 0, duration: 0.04, ease: "none" });
        tl.add(shakeTl, time);
      }

      // --- Scene 1 Animations ---
      tl.fromTo(
        "#slam-block-1",
        { scale: 1.8, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.2, ease: "back.out(1.6)", immediateRender: false },
        0.5
      );
      addBeatFlash(0.5, 0.4);
      addCameraShake(0.5, 5);

      // Rapid exit
      tl.to("#slam-block-1", { opacity: 0, scale: 1.1, duration: 0.1, ease: "power2.in" }, 2.2);

      // --- Scene 2 Animations ---
      tl.fromTo(
        "#camera-rig-scene2",
        { opacity: 0, scale: 1.0 },
        { opacity: 1, duration: 0.2, ease: "power2.out", immediateRender: false },
        10.0
      );
      tl.to("#camera-rig-scene2", { scale: 1.08, x: 25, duration: 2.5, ease: "sine.out" }, 10.2);
    </script>
  </body>
</html>

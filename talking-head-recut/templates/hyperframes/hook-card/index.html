<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .hook-card {
        position: absolute;
        top: 90px;
        left: 40px;
        right: 40px;
        background: rgba(11, 25, 44, 0.88);
        border: 1.5px solid rgba(0, 210, 223, 0.5);
        border-radius: 20px;
        padding: 24px 28px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 210, 223, 0.2);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .tag {
        display: inline-block;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #00D2DF;
        background: rgba(0, 210, 223, 0.15);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid rgba(0, 210, 223, 0.3);
        margin-bottom: 12px;
      }
      .main-title {
        color: #F8F9FA;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      .main-title span {
        color: #00D2DF;
      }
      .sub-title {
        color: #94A3B8;
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slot_01"
      data-start="0"
      data-duration="3.4"
      data-width="720"
      data-height="1280"
    >
      <div id="hook-card" class="clip hook-card" data-start="0" data-duration="3.4" data-track-index="0">
        <div class="tag">DAN MARTELL'S METHOD</div>
        <h1 class="main-title">7 AREAS OF <span>LIFE</span></h1>
        <p class="sub-title">A Worthwhile Experiment</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#hook-card", 
        { y: -50, opacity: 0, scale: 0.95 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 
        0.2
      );
      tl.to("#hook-card", 
        { y: -30, opacity: 0, duration: 0.4, ease: "power2.in" }, 
        2.9
      );
      window.__timelines["slot_01"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

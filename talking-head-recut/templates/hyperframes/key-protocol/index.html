<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        position: absolute;
        top: 85px;
        left: 36px;
        right: 36px;
        background: rgba(11, 25, 44, 0.92);
        border: 1.5px solid rgba(0, 210, 223, 0.45);
        border-radius: 20px;
        padding: 24px 28px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), 0 0 25px rgba(0, 210, 223, 0.2);
        backdrop-filter: blur(14px);
      }
      .tag {
        display: inline-block;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #00D2DF;
        background: rgba(0, 210, 223, 0.15);
        padding: 5px 14px;
        border-radius: 20px;
        border: 1px solid rgba(0, 210, 223, 0.35);
        margin-bottom: 14px;
      }
      .rule-item {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
      }
      .step-num {
        font-size: 14px;
        font-weight: 800;
        color: #00D2DF;
        background: rgba(0, 210, 223, 0.18);
        border: 1px solid rgba(0, 210, 223, 0.4);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .step-text {
        font-size: 19px;
        font-weight: 700;
        color: #F8F9FA;
        line-height: 1.3;
      }
      .step-text span {
        color: #00D2DF;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slot_11"
      data-start="0"
      data-duration="6"
      data-width="720"
      data-height="1280"
    >
      <div id="rule-card" class="clip card" data-start="0" data-duration="6" data-track-index="0">
        <div class="tag">EXECUTION PROTOCOL</div>
        <div class="rule-item" id="rule-1">
          <div class="step-num">1</div>
          <div class="step-text">Every Sunday, <span>rate 1 to 5</span></div>
        </div>
        <div class="rule-item" id="rule-2">
          <div class="step-num">2</div>
          <div class="step-text">Pick the <span>2 lowest areas</span></div>
        </div>
        <div class="rule-item" id="rule-3">
          <div class="step-num">→</div>
          <div class="step-text">Take <span>2 actions next week</span> to pull them up</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rule-card", 
        { y: -30, opacity: 0, scale: 0.95 }, 
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 
        0.2
      );
      tl.fromTo(["#rule-1", "#rule-2", "#rule-3"], 
        { x: -20, opacity: 0 }, 
        { x: 0, opacity: 1, duration: 0.4, stagger: 0.25, ease: "power2.out" }, 
        0.5
      );
      tl.to("#rule-card", 
        { y: -30, opacity: 0, duration: 0.4, ease: "power2.in" }, 
        5.4
      );
      window.__timelines["slot_11"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
